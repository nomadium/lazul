name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 2 * * *"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let one architecture's failure not cancel the other's run.
      fail-fast: false
      matrix:
        arch: [riscv64, amd64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the development image
        run: make image

      - name: Lint Ruby code
        if: matrix.arch == 'riscv64'    # the same code for both
        run: ./dmake lint

      - name: Build the kernel
        run: ./dmake ARCH=$ARCH -j$(nproc)

      - name: Test with 1 hart
        run: ./dmake test ARCH=$ARCH SMP=1

      - name: Test with 4 harts
        run: ./dmake test ARCH=$ARCH SMP=4

      - name: Test with 8 harts
        run: ./dmake test ARCH=$ARCH SMP=8

      - name: Test booting through UEFI and the EFI loader
        run: ./dmake test ARCH=$ARCH SMP=4 BOOT=uefi
